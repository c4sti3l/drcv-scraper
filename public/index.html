<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>DRCV Herbern — Live-Timing Archiv</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#000000" />
<style>
  :root {
    color-scheme: dark;

    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-press: #333335;
    --hairline: rgba(255,255,255,0.09);
    --hairline-strong: rgba(255,255,255,0.16);

    --text: rgba(255,255,255,0.94);
    --text-secondary: rgba(255,255,255,0.56);
    --text-tertiary: rgba(255,255,255,0.36);

    --accent: #ff9f0a;
    --accent-text: #ffb340;
    --success: #32d74b;
    --live: #ff453a;

    --gold: #ffd60a;
    --silver: #c7c7cc;
    --bronze: #e0904f;

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.22, 1.12, 0.36, 1);
    --dur-fast: 140ms;
    --dur-med: 320ms;

    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    font-size: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    overscroll-behavior-y: none;
  }

  body {
    margin: 0;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding-bottom: calc(env(safe-area-inset-bottom) + 2rem);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #app { max-width: 720px; margin-inline: auto; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

  /* ---------- Header ---------- */

  .topbar {
    position: sticky; top: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 0.9rem) 1.1rem 0.75rem;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid transparent;
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .topbar.scrolled { border-bottom-color: var(--hairline); }

  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-height: 2rem; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 0.15rem;
    background: none; border: none; padding: 0.3rem 0.4rem 0.3rem 0.1rem; margin-left: -0.4rem;
    color: var(--accent-text); font-size: 1rem; font-weight: 590;
    border-radius: var(--radius-sm);
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { background: var(--surface); transform: scale(0.97); }
  .back-btn svg { width: 1.15rem; height: 1.15rem; }

  .edit-btn {
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: none; border: none; padding: 0.3rem 0.5rem; margin-right: -0.4rem;
    color: var(--accent-text); font-size: 0.95rem; font-weight: 590;
    border-radius: var(--radius-sm);
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .edit-btn:active { background: var(--surface); transform: scale(0.94); }
  .edit-btn.danger { color: var(--live); }
  .edit-btn svg { width: 1.1rem; height: 1.1rem; }

  h1.title {
    font-size: clamp(1.35rem, 5vw, 1.7rem);
    font-weight: 750;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 0.86rem;
    letter-spacing: -0.01em;
    margin-top: 0.15rem;
    display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
  }

  main { padding: 0.75rem 1.1rem 0; }

  /* ---------- Segmented filter ---------- */

  .filter-scroll { overflow-x: auto; margin: 0 -1.1rem 1.1rem; padding: 0 1.1rem; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-row { display: flex; gap: 0.4rem; width: max-content; }
  .filter-pill {
    background: var(--surface); border: 1px solid var(--hairline);
    color: var(--text-secondary); font-size: 0.82rem; font-weight: 590;
    padding: 0.4rem 0.85rem; border-radius: 999px; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .filter-pill:active { transform: scale(0.96); }
  .filter-pill.active { background: var(--accent); color: #1a0f00; border-color: transparent; }

  /* ---------- Grouped list ---------- */

  .section-header {
    font-size: 0.75rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-tertiary); margin: 1.4rem 0.2rem 0.5rem;
  }
  .section-header:first-child { margin-top: 0; }
  .section-header .dot-live {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--live); margin-right: 0.4rem; vertical-align: middle;
    animation: pulse 1.8s var(--ease-out) infinite;
  }

  .group {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  .row {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.7rem 0.85rem;
    min-height: 3.1rem;
    border-bottom: 1px solid var(--hairline);
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .group > .row-wrap:last-child .row,
  .group > .row:last-child { border-bottom: none; }
  .row:active { background: var(--surface-press); }

  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-title {
    font-size: 0.98rem; font-weight: 600; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 0.4rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-meta {
    font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.15rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-trail {
    flex: 0 0 auto; display: flex; align-items: center; gap: 0.5rem;
    color: var(--text-secondary); font-size: 0.85rem; font-family: var(--font-mono);
  }
  .chevron { color: var(--text-tertiary); width: 0.85rem; height: 0.85rem; flex: none; }

  .delete-btn {
    flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--live); border: none; color: #fff;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .delete-btn:active { transform: scale(0.9); }
  .delete-btn svg { width: 0.85rem; height: 0.85rem; }

  .live-badge {
    display: inline-flex; align-items: center; gap: 0.32rem;
    font-family: var(--font-sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em;
    color: var(--live); background: color-mix(in srgb, var(--live) 16%, transparent);
    padding: 0.15rem 0.5rem 0.15rem 0.4rem; border-radius: 999px;
  }
  .live-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--live); animation: pulse 1.8s var(--ease-out) infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  /* ---------- Result rows ---------- */

  .pos-badge {
    flex: none; width: 2.15rem; height: 2.15rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 0.95rem;
    background: var(--surface-2); color: var(--text-secondary);
  }
  .pos-badge.p1 { background: color-mix(in srgb, var(--gold) 22%, var(--surface-2)); color: var(--gold); }
  .pos-badge.p2 { background: color-mix(in srgb, var(--silver) 22%, var(--surface-2)); color: var(--silver); }
  .pos-badge.p3 { background: color-mix(in srgb, var(--bronze) 22%, var(--surface-2)); color: var(--bronze); }

  .driver-name { font-weight: 600; letter-spacing: -0.01em; }
  .driver-sub { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.1rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .stat-primary { font-family: var(--font-mono); font-size: 0.92rem; font-weight: 600; color: var(--text); }
  .stat-caption { font-size: 0.68rem; color: var(--text-tertiary); text-align: right; margin-top: 0.05rem; }

  /* ---------- Expand panel (CSS grid-rows animation) ---------- */

  .expand-wrap {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--dur-med) var(--ease-out);
  }
  .expand-wrap.open { grid-template-rows: 1fr; }
  .expand-inner { overflow: hidden; }
  .expand-content {
    padding: 0.2rem 0.85rem 1rem;
    border-bottom: 1px solid var(--hairline);
  }
  .row-wrap:last-child .expand-content { border-bottom: none; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(6.4rem, 1fr));
    gap: 0.7rem 0.5rem; margin-bottom: 0.9rem;
  }
  .stat-cell .label { font-size: 0.66rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); }
  .stat-cell .value { font-family: var(--font-mono); font-size: 0.88rem; margin-top: 0.1rem; }

  .lap-label { font-size: 0.75rem; color: var(--text-secondary); margin: 0.2rem 0 0.55rem; }
  .lap-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .lap-chip {
    display: flex; flex-direction: column; align-items: center; gap: 0.08rem;
    min-width: 3.4rem; padding: 0.32rem 0.5rem;
    border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm);
    font-family: var(--font-mono); background: var(--surface-2);
  }
  .lap-chip .lap-num { font-size: 0.62rem; color: var(--text-tertiary); letter-spacing: 0.02em; }
  .lap-chip .lap-time { font-size: 0.85rem; }
  .lap-chip.best { border-color: color-mix(in srgb, var(--success) 55%, transparent); background: color-mix(in srgb, var(--success) 14%, var(--surface-2)); }
  .lap-chip.best .lap-time { color: var(--success); font-weight: 700; }
  .lap-gap { align-self: center; color: var(--text-tertiary); font-size: 0.75rem; padding: 0 0.2rem; }

  /* ---------- Messages ---------- */

  .messages { margin-top: 1.4rem; }
  .message-item { padding: 0.65rem 0.85rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--hairline); }
  .group > .message-item:last-child { border-bottom: none; }
  .message-item time { display: block; font-size: 0.72rem; color: var(--text-tertiary); margin-bottom: 0.15rem; }

  /* ---------- Empty / loading ---------- */

  .empty {
    text-align: center; color: var(--text-tertiary); font-size: 0.9rem;
    padding: 3.5rem 1rem;
  }
  .skeleton-row { height: 3.1rem; border-bottom: 1px solid var(--hairline); position: relative; overflow: hidden; }
  .group > .skeleton-row:last-child { border-bottom: none; }
  .skeleton-row::after {
    content: ""; position: absolute; inset: 0.7rem 0.85rem;
    background: var(--surface-2); border-radius: var(--radius-sm);
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }

  /* ---------- Reduced motion ---------- */

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--dur-med); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
